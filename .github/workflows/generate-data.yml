name: Daily Dashboard Email

on:
  workflow_dispatch:
    inputs:
      run_scope:
        description: daily = existing email run; data-check = FX refresh and free report checks only (no mail/models)
        type: choice
        required: true
        default: daily
        options:
          - daily
          - data-check
  schedule:
    # 09:15 KST every day.
    - cron: '15 0 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: daily-dashboard-email
  cancel-in-progress: false

jobs:
  generate-data-and-send-email:
    runs-on: ubuntu-latest
    outputs:
      dataset_ref: ${{ steps.data_commit.outputs.sha }}
      run_scope: ${{ steps.run_scope.outputs.scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate requested run scope
        id: run_scope
        run: node scripts/daily-run-scope.js
        env:
          FX_REQUESTED_RUN_SCOPE: ${{ inputs.run_scope || '' }}

      - name: Validate required exchange API secrets
        run: node scripts/validate-api-keys.js
        env:
          VITE_EXCHANGERATE_API_KEY: ${{ secrets.VITE_EXCHANGERATE_API_KEY }}
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}

      - name: Generate full and fallback datasets
        run: npm run generate:data
        env:
          VITE_EXCHANGERATE_API_KEY: ${{ secrets.VITE_EXCHANGERATE_API_KEY }}
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}

      - name: Sync exchange rates to Supabase
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if [ "$FX_DATA_CHECK_ONLY" = "true" ]; then
              echo "Data-check requires the configured Supabase connection; sync was not performed." >&2
              exit 1
            fi
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; keeping JSON-only operation."
            exit 0
          fi
          npm run sync:supabase
          npm run verify:supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FX_DATA_CHECK_ONLY: ${{ steps.run_scope.outputs.scope == 'data-check' && 'true' || 'false' }}

      - name: Read dataset metadata
        id: dataset
        run: |
          BASE_DATE=$(jq -r '.baseDate // empty' public/data.json)
          FETCHED_AT=$(jq -r '.fetchedAt // empty' public/data.json)

          if [ -z "$BASE_DATE" ]; then
            echo "public/data.json is missing baseDate" >&2
            exit 1
          fi

          echo "base_date=$BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "fetched_at=$FETCHED_AT" >> "$GITHUB_OUTPUT"

      - name: Create market context
        if: steps.run_scope.outputs.scope != 'data-check'
        run: node scripts/create-market-context.js
        env:
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FX_EMAIL_DATA_SOURCE: auto

      - name: Sync FX 2.0 UI feature flag
        continue-on-error: true
        run: node scripts/write-fx-report-config.js
        env:
          FX_REPORT_ENABLED: ${{ vars.FX_REPORT_ENABLED || 'false' }}

      - name: Generate optional FX 2.0 report
        # Keep same-day enrichment intact for the separately approved automatic mode.
        if: steps.run_scope.outputs.scope != 'data-check' && vars.FX_REPORT_PUBLISH_MODE == 'automatic' && vars.FX_REPORT_GENERATOR != 'currency'
        continue-on-error: true
        run: npm run generate:report
        env:
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FX_EMAIL_DATA_SOURCE: auto
          FX_REPORT_ENABLED: ${{ vars.FX_REPORT_ENABLED || 'true' }}
          FX_REPORT_PUBLISH_MODE: ${{ vars.FX_REPORT_PUBLISH_MODE || 'review' }}
          FX_REPORT_AI_MODE: ${{ vars.FX_REPORT_AI_MODE || 'optional' }}
          FX_REPORT_AI_MODEL: ${{ vars.FX_REPORT_AI_MODEL || 'openrouter/free' }}

      - name: Store optional FX 2.0 report
        if: steps.run_scope.outputs.scope != 'data-check' && vars.FX_REPORT_PUBLISH_MODE == 'automatic' && vars.FX_REPORT_GENERATOR != 'currency'
        continue-on-error: true
        shell: bash
        run: |
          if [ -f fx-report-run.json ]; then
            npm run persist:report
          else
            echo "FX 2.0 report artifact is absent; preserving the 1.x flow."
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Compose email metadata
        if: steps.run_scope.outputs.scope != 'data-check'
        id: email
        run: node scripts/compose-email.js
        env:
          FX_EMAIL_REPORT_MODE: ${{ vars.FX_EMAIL_REPORT_MODE || 'legacy' }}
          FX_EMAIL_SEND_APPROVED: ${{ vars.FX_EMAIL_SEND_APPROVED || 'false' }}
          FX_EMAIL_HOLD: ${{ vars.FX_EMAIL_HOLD || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Commit updated dataset
        id: data_commit
        run: |
          if git diff --quiet -- public/data.json data/fx-full-history.json data/alpha-vantage-history.json src/generated/fxReportConfig.ts; then
            echo "No dataset changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data.json data/fx-full-history.json data/alpha-vantage-history.json src/generated/fxReportConfig.ts
            git commit -m "chore: refresh static exchange data"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Puppeteer browser
        if: steps.run_scope.outputs.scope != 'data-check'
        run: npx puppeteer browsers install chrome

      - name: Create email chart
        if: steps.run_scope.outputs.scope != 'data-check'
        run: node scripts/create-email-chart.js
        env:
          FX_EMAIL_REPORT_MODE: ${{ steps.email.outputs.report_mode }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FX_EMAIL_DATA_SOURCE: auto

      - name: Validate mailing list
        if: steps.run_scope.outputs.scope != 'data-check'
        id: mailing
        run: |
          if [ ! -f "data/mailing_list.json" ]; then
            echo "No mailing list file found; email will be skipped."
            echo "emails=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -e 'type == "array" and all(.[]; type == "string" and test("^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"))' data/mailing_list.json > /dev/null

          EMAILS=$(jq -r 'join(",")' data/mailing_list.json)
          if [ -z "$EMAILS" ]; then
            echo "Mailing list is empty; email will be skipped."
          fi

          echo "emails=$EMAILS" >> "$GITHUB_OUTPUT"

      - name: Send dashboard email
        if: steps.run_scope.outputs.scope != 'data-check' && steps.mailing.outputs.emails != '' && steps.email.outputs.delivery_mode == 'legacy'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ steps.mailing.outputs.emails }}
          EMAIL_SUBJECT: ${{ steps.email.outputs.subject }}
          EMAIL_HTML_BODY: ${{ steps.email.outputs.html_body }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          username = os.environ.get("SMTP_USERNAME", "").strip()
          password = "".join(os.environ.get("SMTP_PASSWORD", "").split())
          recipients = [
              item.strip()
              for item in os.environ.get("EMAIL_TO", "").split(",")
              if item.strip()
          ]

          if not username:
              raise SystemExit("SMTP_USERNAME secret is missing or empty.")
          if not password:
              raise SystemExit("SMTP_PASSWORD secret is missing or empty.")
          if not recipients:
              raise SystemExit("No email recipients were provided.")

          chart_path = Path("email-chart.png")
          if not chart_path.exists():
              raise SystemExit("email-chart.png was not created.")

          message = EmailMessage()
          message["Subject"] = os.environ["EMAIL_SUBJECT"]
          message["From"] = f"LATAM FX Admin <{username}>"
          message["To"] = ", ".join(recipients)
          message.set_content("LATAM FX daily dashboard is included below.")
          message.add_alternative(os.environ["EMAIL_HTML_BODY"], subtype="html")

          html_part = message.get_payload()[1]
          html_part.add_related(
              chart_path.read_bytes(),
              maintype="image",
              subtype="png",
              cid="<fx-chart-image>",
              filename="email-chart.png",
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(username, password)
              smtp.send_message(message)
          PY

      # Opt-in only. The default legacy sender above remains exclusive.
      # Plan performs reads only; the explicit send approval is a release setting.
      - name: Send approved-report dashboard email
        if: steps.run_scope.outputs.scope != 'data-check' && steps.mailing.outputs.emails != '' && steps.email.outputs.report_mode != 'legacy' && steps.email.outputs.mail_hold != 'true'
        timeout-minutes: 15
        continue-on-error: ${{ steps.email.outputs.delivery_mode != 'approved' }}
        env:
          FX_EMAIL_REPORT_MODE: approved
          FX_EMAIL_HOLD: ${{ steps.email.outputs.mail_hold }}
          FX_EMAIL_SEND_APPROVED: ${{ steps.email.outputs.delivery_mode == 'approved' && 'true' || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USERNAME: ${{ steps.email.outputs.delivery_mode == 'approved' && secrets.SMTP_USERNAME || '' }}
          SMTP_PASSWORD: ${{ steps.email.outputs.delivery_mode == 'approved' && secrets.SMTP_PASSWORD || '' }}
        run: |
          if [ "$FX_EMAIL_SEND_APPROVED" = "true" ]; then
            node scripts/send-dashboard-email.mjs --send
          else
            node scripts/send-dashboard-email.mjs --plan
          fi

      - name: Upload dashboard artifacts
        if: always() && steps.run_scope.outputs.scope != 'data-check'
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard-email-${{ steps.dataset.outputs.base_date || github.run_id }}
          path: |
            email-chart.png
            email-chart-meta.json
            email-market-context.json
            fx-report-published.json
          if-no-files-found: warn

  # Review-mode generation runs separately; it cannot block the existing FX/email job.
  # The selected generator is exclusive. Existing deployments default to legacy.
  optional-review-report:
    needs: generate-data-and-send-email
    if: >-
      ${{ always() && !cancelled() && needs.generate-data-and-send-email.outputs.run_scope != 'data-check'
          && vars.FX_REPORT_PUBLISH_MODE != 'automatic'
          && vars.FX_REPORT_GENERATOR != 'currency'
          && vars.FX_REPORT_OPERATIONAL_HOLD != 'true'
          && needs.generate-data-and-send-email.outputs.dataset_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-data-and-send-email.outputs.dataset_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Generate review report from the committed full dataset
        run: npm run generate:report
        env:
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FX_EMAIL_DATA_SOURCE: json
          FX_REPORT_ENABLED: ${{ vars.FX_REPORT_ENABLED || 'true' }}
          FX_REPORT_PUBLISH_MODE: review
          FX_REPORT_AI_MODE: ${{ vars.FX_REPORT_AI_MODE || 'optional' }}
          FX_REPORT_AI_MODEL: ${{ vars.FX_REPORT_AI_MODEL || 'openrouter/free' }}
      - name: Store review report without publishing or sending email
        shell: bash
        run: |
          if [ -f fx-report-run.json ]; then
            npm run persist:report
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Future opt-in only: DB control starts disabled with zero approved budget.
  # Default plan mode never calls a model. Only an explicit execution variable
  # plus server-owned processing policy, controls and budget can dispatch.
  # No raw request/response artifacts, paid retry, free fallback, email or publish.
  currency-review-report:
    needs: generate-data-and-send-email
    if: >-
      ${{ always() && !cancelled() && (
          (needs.generate-data-and-send-email.outputs.run_scope == 'data-check'
            && needs.generate-data-and-send-email.result == 'success'
            && needs.generate-data-and-send-email.outputs.dataset_ref != '')
          || (needs.generate-data-and-send-email.outputs.run_scope != 'data-check'
          && vars.FX_REPORT_GENERATOR == 'currency'
          && vars.FX_REPORT_ENABLED == 'true'
          && vars.FX_REPORT_OPERATIONAL_HOLD != 'true'
          && (vars.FX_REPORT_PUBLISH_MODE == 'review' || vars.FX_REPORT_PUBLISH_MODE == '')) ) }}
    runs-on: ubuntu-latest
    # Up to 60 x 120s model requests, collection/setup, and safe checkpointing.
    # The coordinator stops starting requests before its own 138-minute limit.
    timeout-minutes: ${{ needs.generate-data-and-send-email.outputs.run_scope == 'data-check' && 20 || 150 }}
    continue-on-error: ${{ needs.generate-data-and-send-email.outputs.run_scope != 'data-check' }}
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FX_EMAIL_DATA_SOURCE: json
      FX_REPORT_GENERATOR: currency
      FX_REPORT_ENABLED: ${{ vars.FX_REPORT_ENABLED }}
      FX_REPORT_OPERATIONAL_HOLD: ${{ vars.FX_REPORT_OPERATIONAL_HOLD }}
      FX_REPORT_PUBLISH_MODE: review
      # Official indicator credentials stay server-only and are never echoed.
      INEGI_INDICATORS_TOKEN: ${{ secrets.INEGI_INDICATORS_TOKEN }}
      FX_REPORT_PDF_PYTHON: python
      # A missing new data commit may still collect free news against the saved
      # reference, but cannot certify a successful FX refresh for paid writing.
      FX_REPORT_DATA_REFRESH: ${{ needs.generate-data-and-send-email.outputs.dataset_ref != '' && 'committed' || 'not_confirmed' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-data-and-send-email.outputs.dataset_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded official PDF extractor
        run: python -m pip install --disable-pip-version-check -r scripts/currency-report/requirements-official.txt
      - name: Verify official PDF extraction environment
        run: python -c "import pypdf; assert pypdf.__version__ == '6.10.0'; print('Official PDF extractor ready')"
      - run: npm ci
      - name: Inspect operating supply without model requests
        if: needs.generate-data-and-send-email.outputs.run_scope != 'data-check' && vars.FX_REPORT_EXECUTION_MODE != 'execute'
        run: npm run report:operate -- --action plan
      - name: Check data-only report readiness without model requests
        if: needs.generate-data-and-send-email.outputs.run_scope == 'data-check'
        run: npm run report:operate -- --action plan --require-ready
      # A missing/other mode remains plan. No inline interpolation into a shell
      # command; changing this variable alone cannot bypass the DB policy.
      - name: Process authorized original reviews and currency drafts
        if: needs.generate-data-and-send-email.outputs.run_scope != 'data-check' && vars.FX_REPORT_EXECUTION_MODE == 'execute'
        run: npm run report:operate -- --action execute
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # Separate administrator notices. Does not share the reader mailing list,
  # publish reports, call models, or delay the existing FX/reader-email job.
  admin-review-notices:
    needs: [generate-data-and-send-email, currency-review-report]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main'
          && needs.generate-data-and-send-email.outputs.run_scope == 'daily'
          && vars.FX_ADMIN_REVIEW_EMAIL_ENABLED == 'true'
          && vars.FX_ADMIN_REVIEW_EMAIL_SEND_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-data-and-send-email.outputs.dataset_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Send deduplicated administrator review digest
        run: node scripts/send-admin-review-email.mjs --send
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FX_ADMIN_REVIEW_EMAIL_TO: ${{ secrets.FX_ADMIN_REVIEW_EMAIL_TO }}
          FX_ADMIN_REVIEW_EMAIL_ENABLED: ${{ vars.FX_ADMIN_REVIEW_EMAIL_ENABLED }}
          FX_ADMIN_REVIEW_EMAIL_SEND_APPROVED: ${{ vars.FX_ADMIN_REVIEW_EMAIL_SEND_APPROVED }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
