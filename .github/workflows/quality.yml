name: Pull Request Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:verify-values && npm run test:period-selection
      - name: Production dependency audit (known xlsx advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
